<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>rust-bot</title>
        <style>
            :root {
                color-scheme: light dark;
                --bg: #f6f7f9;
                --panel: #ffffff;
                --line: #d8dce2;
                --text: #1b1f24;
                --muted: #5b636d;
                --accent: #2f6feb;
                --ok: #1a7f37;
                --ng: #b42318;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #16191d;
                    --panel: #1e2227;
                    --line: #333940;
                    --text: #e6e9ed;
                    --muted: #a3acb8;
                    --accent: #6ea0ff;
                    --ok: #4ac26b;
                    --ng: #ff7b72;
                }
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 16px;
                background: var(--bg);
                color: var(--text);
                font-family: system-ui, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
                font-size: 14px;
                line-height: 1.6;
            }
            h1 {
                font-size: 18px;
                margin: 0 0 12px;
            }
            h2 {
                font-size: 15px;
                margin: 0 0 8px;
            }
            section {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 8px;
                padding: 12px;
                margin-bottom: 16px;
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
            }
            .muted {
                color: var(--muted);
            }
            .ok {
                color: var(--ok);
            }
            .ng {
                color: var(--ng);
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th,
            td {
                border-bottom: 1px solid var(--line);
                padding: 6px 8px;
                text-align: left;
                vertical-align: top;
                white-space: nowrap;
            }
            th {
                color: var(--muted);
                font-weight: 600;
            }
            td.wrap {
                white-space: normal;
                word-break: break-word;
            }
            .scroll {
                overflow-x: auto;
            }
            button {
                background: var(--accent);
                color: #fff;
                border: 0;
                border-radius: 6px;
                padding: 6px 12px;
                font: inherit;
                cursor: pointer;
            }
            button.secondary {
                background: transparent;
                color: var(--text);
                border: 1px solid var(--line);
            }
            input[type="text"],
            select {
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 4px 6px;
                font: inherit;
            }
            input[type="text"] {
                width: 160px;
            }
            #log {
                height: 260px;
                overflow-y: auto;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 6px;
                padding: 8px;
                font-family: ui-monospace, "Consolas", monospace;
                font-size: 12px;
            }
            #log div {
                white-space: pre-wrap;
                word-break: break-word;
            }
            .lv-warn {
                color: #b8860b;
            }
            .lv-error {
                color: var(--ng);
            }
            .lv-debug {
                color: var(--muted);
            }
            @media (max-width: 800px) {
                input[type="text"] {
                    width: 110px;
                }
            }
        </style>
    </head>
    <body>
        <h1>rust-bot</h1>

        <section>
            <div class="row">
                <span>FCM: <strong id="fcm">-</strong></span>
                <span id="conn" class="muted"></span>
                <span class="muted">最終受信 <span id="last">-</span></span>
                <span class="muted">起動 <span id="started">-</span></span>
                <span class="muted">版 <span id="version">-</span></span>
                <span class="muted">転送 <span id="forwards">-</span></span>
                <button id="test-post" type="button">Discord にテスト投稿</button>
                <span id="test-result"></span>
            </div>
        </section>

        <section>
            <h2>アラームの振り分け</h2>
            <div class="row">
                <label>未設定の題名の既定
                    <select id="unknown-mode"></select>
                </label>
                <button id="save" type="button">保存</button>
                <button id="reload" type="button" class="secondary">一覧を更新</button>
                <span id="save-result"></span>
            </div>
            <div class="scroll">
                <table>
                    <thead>
                        <tr>
                            <th>題名</th>
                            <th>振り分け</th>
                            <th>メンション</th>
                            <th>最終発報</th>
                            <th>回数</th>
                        </tr>
                    </thead>
                    <tbody id="alarms"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>ペアリング済みデバイス</h2>
            <div class="row">
                <label><input id="all-devices" type="checkbox" /> スマートアラーム以外も表示する</label>
            </div>
            <div class="scroll">
                <table>
                    <thead>
                        <tr>
                            <th>サーバー</th>
                            <th>種類</th>
                            <th>ID</th>
                            <th>ペアリング時刻</th>
                        </tr>
                    </thead>
                    <tbody id="devices"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>通知履歴</h2>
            <div class="scroll">
                <table>
                    <thead>
                        <tr>
                            <th>時刻</th>
                            <th>種類</th>
                            <th>題名</th>
                            <th>サーバー</th>
                            <th>結果</th>
                        </tr>
                    </thead>
                    <tbody id="history"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2>ログ</h2>
            <div class="row">
                <label>レベル
                    <select id="level">
                        <option value="debug">debug から</option>
                        <option value="info" selected>info から</option>
                        <option value="warn">warn から</option>
                        <option value="error">error のみ</option>
                    </select>
                </label>
            </div>
            <div id="log"></div>
        </section>

        <script>
            'use strict';

            const MODE_LABELS = { discord: 'Discord に投稿', log: 'ログだけ', mute: '無視' };
            const FCM_LABELS = { connecting: '接続中', connected: '接続済み', disconnected: '切断' };
            const OUTCOME_LABELS = {
                posted: '投稿',
                failed: '失敗',
                logged: 'ログのみ',
                muted: '無視',
                skipped: '転送しない設定',
                ignored: '未対応',
                paired: 'ペアリング',
            };
            const KIND_LABELS = {
                alarm: 'アラーム',
                death: '死亡',
                'team-login': 'ログイン',
                'pairing-server': 'サーバー',
                'pairing-entity': 'デバイス',
                unknown: '未対応',
            };
            const LEVEL_ORDER = { debug: 0, info: 1, warn: 2, error: 3 };
            const MAX_HISTORY_ROWS = 200;
            const MAX_LOG_ROWS = 500;
            const SMART_ALARM = 'Smart Alarm';

            const el = (id) => document.getElementById(id);
            let alarmRows = [];
            let devices = [];
            let dirty = false;

            function text(tag, value, className) {
                const node = document.createElement(tag);
                node.textContent = value === undefined || value === null || value === '' ? '-' : String(value);
                if (className) node.className = className;
                return node;
            }

            function formatTime(iso) {
                if (!iso) return '-';
                const date = new Date(iso);
                return Number.isNaN(date.getTime()) ? '-' : date.toLocaleString('ja-JP', { hour12: false });
            }

            function modeSelect(value) {
                const select = document.createElement('select');
                for (const mode of Object.keys(MODE_LABELS)) {
                    const option = document.createElement('option');
                    option.value = mode;
                    option.textContent = MODE_LABELS[mode];
                    if (mode === value) option.selected = true;
                    select.append(option);
                }
                select.addEventListener('change', () => {
                    dirty = true;
                });
                return select;
            }

            function fillUnknownModes() {
                const select = el('unknown-mode');
                for (const mode of Object.keys(MODE_LABELS)) {
                    const option = document.createElement('option');
                    option.value = mode;
                    option.textContent = MODE_LABELS[mode];
                    select.append(option);
                }
                select.addEventListener('change', () => {
                    dirty = true;
                });
            }

            function renderStatus(status) {
                el('fcm').textContent = FCM_LABELS[status.fcm] || status.fcm;
                el('last').textContent = formatTime(status.lastNotificationAt);
                el('started').textContent = formatTime(status.startedAt);
                if (status.version !== undefined) el('version').textContent = status.version;
                if (status.forwards !== undefined) {
                    const forwards = ['アラーム'];
                    if (status.forwards.death) forwards.push('死亡');
                    if (status.forwards.teamLogin) forwards.push('ログイン');
                    el('forwards').textContent = forwards.join('・');
                }
            }

            function renderAlarms() {
                const body = el('alarms');
                body.replaceChildren();
                for (const row of alarmRows) {
                    const tr = document.createElement('tr');
                    tr.append(text('td', row.title, 'wrap'));

                    const modeCell = document.createElement('td');
                    row.modeInput = modeSelect(row.mode);
                    modeCell.append(row.modeInput);
                    tr.append(modeCell);

                    const mentionCell = document.createElement('td');
                    row.mentionInput = document.createElement('input');
                    row.mentionInput.type = 'text';
                    row.mentionInput.value = row.mention || '';
                    row.mentionInput.placeholder = '既定のまま';
                    row.mentionInput.addEventListener('input', () => {
                        dirty = true;
                    });
                    mentionCell.append(row.mentionInput);
                    tr.append(mentionCell);

                    tr.append(text('td', formatTime(row.lastFiredAt)));
                    tr.append(text('td', row.count));
                    body.append(tr);
                }
                if (alarmRows.length === 0) {
                    const tr = document.createElement('tr');
                    const td = text('td', 'まだアラームを受け取っていません');
                    td.colSpan = 5;
                    tr.append(td);
                    body.append(tr);
                }
            }

            function renderDevices() {
                const body = el('devices');
                const showAll = el('all-devices').checked;
                body.replaceChildren();
                for (const device of devices) {
                    if (!showAll && device.entityName !== SMART_ALARM) continue;
                    const tr = document.createElement('tr');
                    tr.append(text('td', device.serverName, 'wrap'));
                    tr.append(text('td', device.entityName));
                    tr.append(text('td', device.entityId));
                    tr.append(text('td', formatTime(device.pairedAt)));
                    body.append(tr);
                }
            }

            function addHistory(event) {
                const body = el('history');
                const tr = document.createElement('tr');
                tr.append(text('td', formatTime(event.time)));
                tr.append(text('td', KIND_LABELS[event.kind] || event.kind));
                tr.append(text('td', event.title, 'wrap'));
                tr.append(text('td', event.server));
                tr.append(text('td', OUTCOME_LABELS[event.outcome] || event.outcome, event.outcome === 'failed' ? 'ng' : ''));
                body.prepend(tr);
                while (body.childElementCount > MAX_HISTORY_ROWS) body.lastElementChild.remove();
            }

            function addLog(event) {
                const box = el('log');
                const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
                const line = document.createElement('div');
                line.className = 'lv-' + event.level;
                line.dataset.level = event.level;
                line.textContent = formatTime(event.time) + ' [' + event.level + '] ' + event.message;
                line.hidden = LEVEL_ORDER[event.level] < LEVEL_ORDER[el('level').value];
                box.append(line);
                while (box.childElementCount > MAX_LOG_ROWS) box.firstElementChild.remove();
                if (atBottom) box.scrollTop = box.scrollHeight;
            }

            function applyLevelFilter() {
                const min = LEVEL_ORDER[el('level').value];
                for (const line of el('log').children) line.hidden = LEVEL_ORDER[line.dataset.level] < min;
            }

            function applyEvent(event) {
                if (event.type === 'log') addLog(event);
                else if (event.type === 'notification') addHistory(event);
                else if (event.type === 'status') el('fcm').textContent = FCM_LABELS[event.fcm] || event.fcm;
                if (event.type === 'notification') el('last').textContent = formatTime(event.time);
            }

            async function loadStatus() {
                const response = await fetch('/api/status');
                if (response.ok) renderStatus(await response.json());
            }

            async function loadAlarms() {
                const response = await fetch('/api/alarms');
                if (!response.ok) return;
                const body = await response.json();
                alarmRows = body.titles;
                devices = body.devices;
                dirty = false;
                renderAlarms();
                renderDevices();
            }

            async function loadSettings() {
                const response = await fetch('/api/settings');
                if (response.ok) el('unknown-mode').value = (await response.json()).unknownAlarmMode;
            }

            // 表を開いている間に自動登録された題名（や別のタブでの変更）を保存で消さないよう、送る直前の一覧を足す
            async function mergeLatestTitles(alarms) {
                let titles;
                try {
                    const response = await fetch('/api/alarms');
                    if (!response.ok) return;
                    titles = (await response.json()).titles;
                } catch {
                    // 一覧を取れなければ表の内容だけで保存する（保存自体は続ける）
                    return;
                }
                for (const row of titles) {
                    if (!row.known || Object.hasOwn(alarms, row.title)) continue;
                    alarms[row.title] = row.mention ? { mode: row.mode, mention: row.mention } : { mode: row.mode };
                }
            }

            async function save() {
                const alarms = Object.fromEntries(
                    alarmRows.map((row) => {
                        const mention = row.mentionInput.value.trim();
                        const setting = mention === '' ? { mode: row.modeInput.value } : { mode: row.modeInput.value, mention };
                        return [row.title, setting];
                    }),
                );
                await mergeLatestTitles(alarms);
                const settings = { version: 1, unknownAlarmMode: el('unknown-mode').value, alarms };
                const result = el('save-result');
                try {
                    const response = await fetch('/api/settings', {
                        method: 'PUT',
                        headers: { 'content-type': 'application/json' },
                        body: JSON.stringify(settings),
                    });
                    if (response.ok) {
                        dirty = false;
                        result.className = 'ok';
                        result.textContent = '保存しました';
                        await loadAlarms();
                        return;
                    }
                    const body = await response.json().catch(() => ({}));
                    result.className = 'ng';
                    result.textContent = '保存できません: ' + (body.error || response.status);
                } catch (error) {
                    result.className = 'ng';
                    result.textContent = '保存できません: ' + error;
                }
            }

            async function testPost() {
                const result = el('test-result');
                result.className = 'muted';
                result.textContent = '送信中...';
                try {
                    const response = await fetch('/api/test-post', { method: 'POST', headers: { 'content-type': 'application/json' } });
                    if (response.ok) {
                        result.className = 'ok';
                        result.textContent = '投稿しました';
                        return;
                    }
                    const body = await response.json().catch(() => ({}));
                    result.className = 'ng';
                    result.textContent = '投稿できません: ' + (body.error || response.status);
                } catch (error) {
                    result.className = 'ng';
                    result.textContent = '投稿できません: ' + error;
                }
            }

            function connect() {
                const source = new EventSource('/api/events');
                source.addEventListener('snapshot', (message) => {
                    const snapshot = JSON.parse(message.data);
                    el('history').replaceChildren();
                    el('log').replaceChildren();
                    renderStatus(snapshot.status);
                    for (const event of snapshot.events) applyEvent(event);
                    el('conn').textContent = '';
                    void loadStatus();
                    // 編集中の表を再接続で消さない（保存すれば dirty が下りる）
                    if (!dirty) void loadAlarms();
                });
                for (const type of ['log', 'notification', 'status']) {
                    source.addEventListener(type, (message) => {
                        const event = JSON.parse(message.data);
                        applyEvent(event);
                        // 発報で自動登録された題名を表に出す（編集中は保存時に合成するので触らない）
                        if (event.type === 'notification' && event.kind === 'alarm' && !dirty) void loadAlarms();
                    });
                }
                source.addEventListener('error', () => {
                    el('conn').textContent = '（画面が切断されました。再接続します）';
                });
            }

            fillUnknownModes();
            el('save').addEventListener('click', () => void save());
            el('reload').addEventListener('click', () => void loadAlarms());
            el('test-post').addEventListener('click', () => void testPost());
            el('all-devices').addEventListener('change', renderDevices);
            el('level').addEventListener('change', applyLevelFilter);
            void loadSettings();
            void loadAlarms();
            void loadStatus();
            connect();
        </script>
    </body>
</html>
